<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YCT 1 · Bài 12 · Game ôn tập</title>
<style>
:root{--bg:#FFF8EC;--ink:#25406B;--red:#E5322D;--teal:#1FA89A;--orange:#FF8A3D;--pink:#FF6F91;--purple:#8E6CD8;--yellow:#F5B700}
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);text-align:center}
h1{margin:14px 0 4px;font-size:26px}.sub{color:#6B7C99;margin-bottom:10px}
.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px}
button{font:inherit;cursor:pointer;border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:16px;padding:10px 18px;font-weight:700}
button:hover{transform:translateY(-2px)}button.on{background:var(--yellow)}
.hud{display:flex;gap:14px;justify-content:center;font-size:20px;font-weight:700;margin:6px}
.card{margin:10px auto;max-width:520px;background:#fff;border:4px solid var(--yellow);border-radius:24px;padding:14px}
.emoji{font-size:110px;line-height:1.1}.han{font-size:64px;font-weight:700}.py{color:var(--red);font-size:24px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:640px;margin:8px auto;padding:0 12px}
.grid button{font-size:20px;padding:16px 8px}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:640px;margin:8px auto;padding:0 12px}
.opts button{font-size:60px;padding:6px}.ok{background:#bdf0c4!important}.no{background:#ffc9c9!important;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .4s}@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
#msg{min-height:30px;font-size:20px;font-weight:700}
</style></head><body>
<h1>🎮 YCT 1 · Bài 12 复习 · Game ôn tập</h1>
<div class="sub">Chọn chế độ rồi bấm Bắt đầu. Dành cho cả lớp chơi theo đội.</div>
<div class="bar"><button id="m1" class="on">🧩 Phân loại nhanh</button><button id="m2">🎧 Nghe và chọn</button><button id="go">▶ Bắt đầu</button></div>
<div class="hud"><span>⭐ <b id="sc">0</b></span><span>🔥 <b id="st">0</b></span><span>⏱ <b id="tm">60</b>s</span></div>
<div id="msg"></div>
<div id="play"></div>
<script>
const W=[
["爸爸","bàba","👨‍👧","people"],["妈妈","māma","👩‍👧","people"],["老师","lǎoshī","👩‍🏫","people"],
["家","jiā","🏠","places"],["学校","xuéxiào","🏫","places"],
["苹果","píngguǒ","🍎","food"],["米饭","mǐfàn","🍚","food"],["牛奶","niúnǎi","🥛","food"],["面条","miàntiáo","🍜","food"],["水","shuǐ","💧","food"],
["狗","gǒu","🐶","animals"],["猫","māo","🐱","animals"],["鱼","yú","🐟","animals"],["鸟","niǎo","🐦","animals"],["乌龟","wūguī","🐢","animals"]];
const CAT={places:"🏠 Nơi chốn",people:"👪 Người",food:"🍽 Đồ ăn & uống",animals:"🐾 Động vật"};
let mode=1,score=0,streak=0,t=60,timer=null,cur=null,running=false;
const $=id=>document.getElementById(id);
function say(txt){try{const u=new SpeechSynthesisUtterance(txt);u.lang="zh-CN";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function beep(ok){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?660:200;g.gain.value=.08;o.start();o.stop(c.currentTime+.15)}catch(e){}}
$("m1").onclick=()=>{mode=1;$("m1").classList.add("on");$("m2").classList.remove("on")};
$("m2").onclick=()=>{mode=2;$("m2").classList.add("on");$("m1").classList.remove("on")};
$("go").onclick=start;
function start(){score=0;streak=0;t=60;running=true;upd();clearInterval(timer);timer=setInterval(()=>{t--;upd();if(t<=0)end()},1000);next()}
function upd(){$("sc").textContent=score;$("st").textContent=streak;$("tm").textContent=Math.max(t,0)}
function end(){running=false;clearInterval(timer);$("play").innerHTML=`<div class="card pop"><div class="emoji">🏆</div><div class="han">${score} điểm</div><div>${score>=12?"Xuất sắc!":score>=7?"Tốt lắm!":"Chơi lại nhé!"}</div></div>`;$("msg").textContent=""}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function next(){if(!running)return;cur=rnd(W);$("msg").textContent="";
 if(mode==1){$("play").innerHTML=`<div class="card pop"><div class="emoji">${cur[2]}</div><div class="py">${cur[1]}</div><div class="han">${cur[0]}</div></div><div class="grid">${Object.keys(CAT).map(k=>`<button data-k="${k}">${CAT[k]}</button>`).join("")}</div>`;
  say(cur[0]);document.querySelectorAll(".grid button").forEach(b=>b.onclick=()=>answer(b,b.dataset.k===cur[3]))}
 else{let o=[cur];while(o.length<4){const x=rnd(W);if(!o.includes(x))o.push(x)}o.sort(()=>Math.random()-.5);
  $("play").innerHTML=`<div class="card pop"><div class="emoji">🎧</div><button id="rep">🔊 Nghe lại</button></div><div class="opts">${o.map(x=>`<button data-h="${x[0]}">${x[2]}</button>`).join("")}</div>`;
  say(cur[0]);$("rep").onclick=()=>say(cur[0]);document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>answer(b,b.dataset.h===cur[0]))}}
function answer(b,ok){if(!running)return;beep(ok);b.classList.add(ok?"ok":"no");
 if(ok){streak++;score+=1+(streak>=3?1:0);$("msg").textContent=`✔ ${cur[0]} ${cur[1]}`}else{streak=0;$("msg").textContent=`✘ Đáp án: ${cur[0]} ${cur[1]}`}
 upd();setTimeout(next,700)}
</script></body></html>
