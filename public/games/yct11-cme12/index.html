<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gấu trúc đói bụng – YCT 11 × CME 12</title>
<style>
:root{--bg:#EAF7FF;--ink:#2B2D42;--red:#E53935;--teal:#00897B;--orange:#EF6C00;--pink:#D81B60;--card:#fff;--line:#CFD8DC}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center}
.app{width:min(980px,100%);padding:16px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:clamp(20px,3.2vw,30px)}
.sub{color:#607D8B;font-size:14px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
button{font:inherit;cursor:pointer;border:0}
.mode{background:#fff;border:3px solid var(--teal);border-radius:16px;padding:14px;text-align:left;color:var(--ink)}
.mode b{display:block;color:var(--teal);font-size:18px;margin-bottom:4px}
.mode:hover,.mode:focus-visible{background:#E0F2F1;outline:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}
.pill.t{border-color:var(--red);color:var(--red)}
.stage{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:center}
@media(max-width:640px){.stage{grid-template-columns:1fr;text-align:center}}
.animal{position:relative;display:flex;flex-direction:column;align-items:center}
.pet{font-size:110px;line-height:1;transition:transform .2s;animation:bob 2.2s ease-in-out infinite}
.pet.eat{animation:chew .5s ease 3}
.pet.no{animation:shake .4s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes chew{0%,100%{transform:scale(1)}50%{transform:scale(1.18,.86)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
.bubble{background:#FFF8E1;border:3px solid #FFB300;border-radius:18px;padding:10px 16px;min-height:64px;display:flex;flex-direction:column;justify-content:center}
.bubble .py{color:var(--red);font-weight:700;min-height:22px}
.bubble .hz{font-size:clamp(34px,6vw,56px);font-family:KaiTi,"楷体","Kaiti SC","Microsoft YaHei",serif;line-height:1.1}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.opt{background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:54px;color:var(--ink);transition:transform .12s,border-color .12s}
.opt:hover,.opt:focus-visible{transform:translateY(-3px);border-color:var(--teal);outline:none}
.opt .hz{font-size:30px;font-family:KaiTi,"楷体","Kaiti SC","Microsoft YaHei",serif}
.opt .py{font-size:14px;color:var(--red);font-weight:700;font-family:Arial,sans-serif}
.opt.ok{border-color:#43A047;background:#E8F5E9}
.opt.bad{border-color:#E53935;background:#FFEBEE}
.feed{min-height:28px;font-weight:700;font-size:18px}
.start{background:var(--orange);color:#fff;border-radius:999px;padding:12px 28px;font-weight:700;font-size:18px}
.ghost{background:#fff;border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;color:var(--ink)}
.bar{height:12px;background:#ECEFF1;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#43A047,#FFB300,#E53935);transform-origin:left;transition:transform .25s linear}
.fall{position:fixed;top:-40px;font-size:32px;pointer-events:none;animation:fall 2.4s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.hidden{display:none!important}
.stars{font-size:48px;letter-spacing:6px}
@media (prefers-reduced-motion:reduce){.pet,.pet.eat,.pet.no,.fall{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div>
    <h1>🐼 Gấu trúc đói bụng</h1>
    <div class="sub">YCT 1 · Bài 11 你吃什么？ × CME 1 · Bài 12 水果和蔬菜 — trò chơi ôn từ cho Tiết 1 và Tiết 2</div>
  </div>

  <section id="menu" class="panel">
    <p style="margin-top:0"><b>Chọn cách chơi</b> (60 giây mỗi lượt, mỗi câu đúng +10 điểm, chuỗi đúng liên tiếp +5):</p>
    <div class="modes">
      <button class="mode" data-mode="read"><b>1 · Nhìn chữ, chọn tranh</b>Thấy chữ Hán và pinyin, chọn đúng món cho gấu trúc.</button>
      <button class="mode" data-mode="listen"><b>2 · Nghe, chọn tranh</b>Nghe từ (nếu máy có giọng Trung), chọn đúng món.</button>
      <button class="mode" data-mode="qa"><b>3 · Hỏi – đáp 吃 / 喝</b>Gấu hỏi 你吃什么？ hay 你喝什么？, chọn câu đáp đúng.</button>
    </div>
    <div class="row" style="margin-top:14px">
      <label class="pill"><input type="checkbox" id="showPy" checked> Hiện pinyin</label>
      <label class="pill"><input type="checkbox" id="showVi"> Hiện nghĩa tiếng Việt</label>
    </div>
  </section>

  <section id="game" class="panel hidden">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <span class="pill">⭐ <span id="score">0</span></span>
      <span class="pill">🔥 chuỗi <span id="streak">0</span></span>
      <span class="pill t">⏱ <span id="time">60</span>s</span>
      <button class="ghost" id="replay">🔊 Nghe lại</button>
      <button class="ghost" id="quit">Thoát</button>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="stage" style="margin-top:14px">
      <div class="animal"><div class="pet" id="pet">🐼</div></div>
      <div class="bubble"><div class="py" id="py"></div><div class="hz" id="hz"></div></div>
    </div>
    <div class="feed" id="feed" aria-live="polite" style="margin:10px 0"></div>
    <div class="opts" id="opts"></div>
  </section>

  <section id="end" class="panel hidden" style="text-align:center">
    <div class="stars" id="stars"></div>
    <h2 id="endTitle" style="margin:6px 0"></h2>
    <p id="endMsg"></p>
    <div class="row" style="justify-content:center">
      <button class="start" id="again">Chơi lại</button>
      <button class="ghost" id="home">Về menu</button>
    </div>
  </section>
</div>

<script>
"use strict";
// Từ vựng chỉ lấy từ YCT 1 bài 11 và CME 1 bài 12 (món ăn, đồ uống, hoa quả, rau củ)
const ITEMS=[
 {h:'米饭',p:'mǐfàn',vi:'cơm',e:'🍚',v:'吃'},
 {h:'面条',p:'miàntiáo',vi:'mì sợi',e:'🍜',v:'吃'},
 {h:'苹果',p:'píngguǒ',vi:'quả táo',e:'🍎',v:'吃'},
 {h:'牛奶',p:'niúnǎi',vi:'sữa bò',e:'🥛',v:'喝'},
 {h:'水',p:'shuǐ',vi:'nước',e:'💧',v:'喝'},
 {h:'蛋糕',p:'dàngāo',vi:'bánh kem',e:'🍰',v:'吃'},
 {h:'香蕉',p:'xiāngjiāo',vi:'chuối',e:'🍌',v:'吃'},
 {h:'水果',p:'shuǐguǒ',vi:'hoa quả',e:'🍇',v:'吃'},
 {h:'蔬菜',p:'shūcài',vi:'rau củ',e:'🥬',v:'吃'},
 {h:'胡萝卜',p:'húluóbo',vi:'cà rốt',e:'🥕',v:'吃'},
 {h:'黄瓜',p:'huángguā',vi:'dưa chuột',e:'🥒',v:'吃'}
];
const PY={'吃':'chī','喝':'hē'};
const PETS=['🐼','🐵','🐰','🐻'];
const $=id=>document.getElementById(id);
let mode='read',score=0,streak=0,left=60,timer=null,cur=null,locked=false,pet=0;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function speak(t){
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;
    const v=speechSynthesis.getVoices().find(x=>/^zh/i.test(x.lang));if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function show(id){['menu','game','end'].forEach(k=>$(k).classList.toggle('hidden',k!==id))}
function start(m){
  mode=m;score=0;streak=0;left=60;locked=false;
  $('score').textContent=0;$('streak').textContent=0;$('time').textContent=60;$('bar').style.transform='scaleX(1)';
  $('replay').classList.toggle('hidden',m==='read');
  show('game');next();
  clearInterval(timer);
  timer=setInterval(()=>{left--;$('time').textContent=left;$('bar').style.transform='scaleX('+left/60+')';if(left<=0)finish()},1000);
}
function setPet(){const el=$('pet');el.textContent=PETS[pet%PETS.length]}
function next(){
  locked=false;$('feed').textContent='';
  const t=ITEMS[Math.floor(Math.random()*ITEMS.length)];cur=t;
  const showPy=$('showPy').checked,showVi=$('showVi').checked;
  const opts=$('opts');opts.innerHTML='';
  if(mode==='read'){
    $('py').textContent=showPy?t.p:'';$('hz').textContent=t.h;
    const others=shuffle(ITEMS.filter(x=>x!==t)).slice(0,3);
    shuffle([t,...others]).forEach(x=>opts.appendChild(optBtn(x.e,showVi?x.vi:'',x===t,'')));
  }else if(mode==='listen'){
    $('py').textContent='🔊';$('hz').textContent='？';
    speak(t.h);
    const others=shuffle(ITEMS.filter(x=>x!==t)).slice(0,3);
    shuffle([t,...others]).forEach(x=>opts.appendChild(optBtn(x.e,showPy?x.p:'',x===t,'')));
  }else{
    const q='你'+t.v+'什么？';
    $('py').textContent=showPy?('Nǐ '+PY[t.v]+' shénme?'):'';
    $('hz').textContent=q+'  '+t.e;
    const wrongVerb=t.v==='吃'?'喝':'吃';
    const other=shuffle(ITEMS.filter(x=>x.v===t.v&&x!==t))[0];
    const list=[
      {h:'我'+t.v+t.h+'。',p:'Wǒ '+PY[t.v]+' '+t.p+'.',ok:true},
      {h:'我'+wrongVerb+t.h+'。',p:'Wǒ '+PY[wrongVerb]+' '+t.p+'.',ok:false},
      {h:'我'+t.v+other.h+'。',p:'Wǒ '+PY[t.v]+' '+other.p+'.',ok:false}
    ];
    shuffle(list).forEach(x=>opts.appendChild(optBtn('',showPy?x.p:'',x.ok,x.h)));
  }
}
function optBtn(emoji,sub,ok,hz){
  const b=document.createElement('button');b.className='opt';
  if(emoji)b.innerHTML='<span>'+emoji+'</span>'+(sub?'<span class="py">'+sub+'</span>':'');
  else b.innerHTML='<span class="hz">'+hz+'</span>'+(sub?'<span class="py">'+sub+'</span>':'');
  b.setAttribute('aria-label',emoji||hz);
  b.addEventListener('click',()=>answer(b,ok));
  return b;
}
function answer(b,ok){
  if(locked)return;
  const pet$=$('pet');
  if(ok){
    locked=true;b.classList.add('ok');streak++;score+=10+(streak>1?5:0);
    $('score').textContent=score;$('streak').textContent=streak;
    $('feed').textContent='谢谢！ Xièxie!  (Cảm ơn!)';
    pet$.classList.remove('no');pet$.classList.add('eat');
    if(mode!=='read')speak(cur.h);
    setTimeout(()=>{pet$.classList.remove('eat');pet++;setPet();if(left>0)next()},1200);
  }else{
    b.classList.add('bad');streak=0;$('streak').textContent=0;
    $('feed').textContent='什么？ Shénme?  Thử lại nhé!';
    pet$.classList.remove('no');void pet$.offsetWidth;pet$.classList.add('no');
    setTimeout(()=>b.classList.remove('bad'),500);
  }
}
function finish(){
  clearInterval(timer);
  const n=score>=150?3:score>=90?2:1;
  $('stars').textContent='⭐'.repeat(n)+'☆'.repeat(3-n);
  $('endTitle').textContent=score+' điểm';
  $('endMsg').textContent=n===3?'你真棒！ Nǐ zhēn bàng! Tuyệt vời!':n===2?'Giỏi lắm! Chơi thêm để lên 3 sao nhé.':'Cố lên! Xem lại từ mới rồi chơi lại nhé.';
  show('end');
  if(n===3)confetti();
}
function confetti(){
  const set=['🍎','🍌','🍚','🥕','🍰','⭐','🥒'];
  for(let i=0;i<24;i++){
    const s=document.createElement('span');s.className='fall';s.textContent=set[i%set.length];
    s.style.left=Math.random()*100+'vw';s.style.animationDelay=(Math.random()*.8)+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),3500);
  }
}
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>start(b.dataset.mode)));
$('replay').addEventListener('click',()=>cur&&speak(cur.h));
$('quit').addEventListener('click',()=>{clearInterval(timer);show('menu')});
$('again').addEventListener('click',()=>start(mode));
$('home').addEventListener('click',()=>show('menu'));
if('speechSynthesis' in window)speechSynthesis.getVoices();
</script>
</body>
</html>
